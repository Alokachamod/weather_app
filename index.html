<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="container-fluid">
        <div class="col-12">
            <div class="row">
                <div class="background-img">
                    <div class="upperSec mt-4 row px-3 px-md-4 ">
                        <div class="col-12 d-flex flex-column flex-md-row align-items-stretch gap-3">
                            <div class="card1 col-12 col-md-4 col-lg-3">
                                <div class="card-body d-flex flex-column">
                                    <div class="cardUpper d-flex justify-content-between align-items-center">
                                        <div class="current-weather">
                                            <p class="weather-time text-light ms-4 mb-1 mt-0">Now</p>
                                            <h1 class="text-light mb-0 ms-5">14<sup>°</sup></h1>
                                        </div>
                                        <div
                                            class="weather-condition d-flex flex-column align-items-center text-center">
                                            <img class="weather-icon" src="/assets/imgs/weather_type_icon/clear day.png"
                                                alt="Clear Day">
                                            <p class="text-light weather-type mb-0">Clear Day</p>
                                        </div>
                                    </div>
                                    <div class="cardbottom">
                                        <h4 class="text-light text-center mt-5 "
                                            style="font-size: 30px; text-shadow: 1px 2px 3px rgb(0, 0, 0, 0.75);">
                                            Bentota</h4>
                                    </div>
                                </div>
                            </div>
                            <div class="card2 col-12 col-md-7 col-lg-5">
                                <!-- From Uiverse.io by joe-watson-sbf -->
                                <div class="search" role="search">
                                    <input type="search" class="search__input" placeholder="Search city"
                                        aria-label="Search city">
                                    <button type="button" class="search__button" aria-label="Search">
                                        <svg class="search__icon" aria-hidden="true" viewBox="0 0 24 24">
                                            <g>
                                                <path
                                                    d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z">
                                                </path>
                                            </g>
                                        </svg>
                                    </button>
                                </div>

                                <div class="mapcard">

                                </div>
                            </div>

                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script type="importmap">
{
  "imports": {
    "@floating-ui/dom": "https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.7.6/dist/floating-ui.dom.esm.min.js",
    "vanilla-calendar-pro": "https://cdn.jsdelivr.net/npm/vanilla-calendar-pro@3.4.0/index.mjs"
  }
}
</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
